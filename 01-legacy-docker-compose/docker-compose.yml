services:
  accounts-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: accounts
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  cards-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: cards
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  loans-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: loans
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  accounts-service:
    build: ../services/accounts
    ports:
      - "8080:8080"
    environment:
      DB_HOST: accounts-db
      DB_PORT: 5432
      DB_NAME: accounts
      DB_USER: postgres
      DB_PASSWORD: postgres
    depends_on:
      accounts-db:
        condition: service_healthy
    restart: on-failure

  cards-service:
    build: ../services/cards
    ports:
      - "8081:8081"
    environment:
      DB_HOST: cards-db
      DB_PORT: 5432
      DB_NAME: cards
      DB_USER: postgres
      DB_PASSWORD: postgres
    depends_on:
      cards-db:
        condition: service_healthy
    restart: on-failure

  loans-service:
    build: ../services/loans
    ports:
      - "8082:8082"
    environment:
      DB_HOST: loans-db
      DB_PORT: 5432
      DB_NAME: loans
      DB_USER: postgres
      DB_PASSWORD: postgres
    depends_on:
      loans-db:
        condition: service_healthy
    restart: on-failure

  gateway-service:
    build: ../services/gateway
    ports:
      - "8090:8090"
    environment:
      ACCOUNTS_SERVICE_URL: http://accounts-service:8080
      CARDS_SERVICE_URL: http://cards-service:8081
      LOANS_SERVICE_URL: http://loans-service:8082
    depends_on:
      - accounts-service
      - cards-service
      - loans-service