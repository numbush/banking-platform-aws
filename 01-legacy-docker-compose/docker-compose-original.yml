# yaml-language-server: $schema=https://raw.githubusercontent.com/compose-spec/compose-spec/master/schema/compose-spec.json

version: '3.8'

services:
  accounts-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: accounts
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - accounts-data:/var/lib/postgresql/data

  cards-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: cards
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - cards-data:/var/lib/postgresql/data

  loans-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: loans
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"
    volumes:
      - loans-data:/var/lib/postgresql/data

  accounts-service:
    build: ./services/accounts
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@accounts-db:5432/accounts
    depends_on:
      - accounts-db

  cards-service:
    build: ./services/cards
    ports:
      - "8081:8081"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@cards-db:5432/cards
    depends_on:
      - cards-db

  loans-service:
    build: ./services/loans
    ports:
      - "8082:8082"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@loans-db:5432/loans
    depends_on:
      - loans-db

  gateway-service:
    build: ./services/gateway
    ports:
      - "8090:8090"
    environment:
      ACCOUNTS_SERVICE_URL: http://accounts-service:8080
      CARDS_SERVICE_URL: http://cards-service:8081
      LOANS_SERVICE_URL: http://loans-service:8082
    depends_on:
      - accounts-service
      - cards-service
      - loans-service

volumes:
  accounts-data:
  cards-data:
  loans-data: